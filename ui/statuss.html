<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iesnieguma statuss · Ezermalas novada pašvaldība</title>
  <style>
    :root {
      --navy: #1D3557;
      --teal: #2A9D8F;
      --coral: #E76F51;
      --bg: #F1F3F5;
      --line: #C9CED6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: #1a1a1a;
    }
    header { background: var(--navy); color: #fff; padding: 16px; }
    header h1 { margin: 0; font-size: 1.25rem; }
    header p { margin: 4px 0 0; font-size: 0.85rem; opacity: 0.85; }
    main { max-width: 720px; margin: 0 auto; padding: 16px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .hint { margin: 0; font-size: 0.9rem; color: #444; }
    label { display: block; font-weight: 600; margin-top: 12px; }
    input {
      width: 100%; padding: 8px; margin-top: 4px; font: inherit;
      border: 1px solid var(--line); border-radius: 6px; background: #fff;
    }
    .field-error { color: var(--coral); font-size: 0.9rem; margin-top: 4px; min-height: 1em; }
    .invalid { border-color: var(--coral); }
    button {
      margin-top: 16px; padding: 10px 20px; font: inherit; font-weight: 600;
      color: #fff; background: var(--teal); border: 0; border-radius: 6px; cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .message { padding: 12px; border-radius: 6px; margin-top: 16px; }
    .message.error { background: #fdece7; border: 1px solid var(--coral); }
    .message.ok { background: #e6f4f2; border: 1px solid var(--teal); }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 8px 0 0; }
    dt { font-weight: 600; }
    dd { margin: 0; }
    footer { font-size: 0.8rem; color: #555; text-align: center; padding: 16px; }
    a { color: var(--navy); }
  </style>
</head>
<body>
  <header>
    <h1>Ezermalas novada pašvaldība · Iesnieguma statuss</h1>
    <p>Mācību prototips. Pašvaldība ir izdomāta. Ievadiet tikai sintētiskus datus.</p>
  </header>

  <main>
    <form id="status-form" class="card" novalidate>
      <p class="hint">Ievadiet iesnieguma numuru un e-pastu, ko norādījāt iesniegumā.</p>

      <label for="id">Iesnieguma numurs</label>
      <input id="id" name="id" autocomplete="off" placeholder="IES-2026-000123">
      <div class="field-error" data-for="id"></div>

      <label for="email">E-pasts</label>
      <input id="email" name="email" type="email" autocomplete="email">
      <div class="field-error" data-for="email"></div>

      <button type="submit" id="submit">Pārbaudīt statusu</button>
      <div id="message" aria-live="polite"></div>
    </form>
  </main>

  <footer>
    <a href="/ui/">Iesniegt iesniegumu</a> · <a href="/docs">Swagger UI (/docs)</a> · Ezermalas pieteikumu sistēma · mācību prototips
  </footer>

  <script>
    // Forma neko nepārbauda pati: visu validāciju dara API, forma tikai parāda kļūdu.
    const ISSUE_TEXT = {
      REQUIRED: "Obligāts lauks",
      INVALID_FORMAT: "Nepareizs formāts",
      TOO_LONG: "Pārāk garš teksts",
    };
    const FIELD_ISSUE_TEXT = {
      id: { INVALID_FORMAT: "Numura formāts: IES-GGGG-NNNNNN" },
    };

    const form = document.getElementById("status-form");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submit");

    function formatDate(isoDate) {
      const [year, month, day] = isoDate.split("-");
      return `${day}.${month}.${year}`;
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text == null ? "" : String(text);
      return div.innerHTML;
    }

    function clearErrors() {
      document.querySelectorAll(".field-error").forEach((el) => (el.textContent = ""));
      document.querySelectorAll(".invalid").forEach((el) => el.classList.remove("invalid"));
      message.className = "";
      message.innerHTML = "";
    }

    function showFieldErrors(details) {
      const unknown = [];
      for (const detail of details || []) {
        const target = document.querySelector(`.field-error[data-for="${detail.field}"]`);
        const text = FIELD_ISSUE_TEXT[detail.field]?.[detail.issue] || ISSUE_TEXT[detail.issue] || detail.issue;
        if (target) {
          target.textContent = text;
          document.getElementById(detail.field)?.classList.add("invalid");
        } else {
          unknown.push(`${detail.field}: ${text}`);
        }
      }
      return unknown;
    }

    function showResult(data) {
      message.className = "message ok";
      message.innerHTML = `
        <dl>
          <dt>Numurs</dt><dd>${escapeHtml(data.id)}</dd>
          <dt>Statuss</dt><dd>${escapeHtml(data.statusName)}</dd>
          <dt>Atbildes termiņš</dt><dd>${escapeHtml(formatDate(data.dueDate))}</dd>
        </dl>`;
    }

    function showError(status, body) {
      const error = (body && body.error) || {};
      message.className = "message error";
      if (status === 404) {
        message.innerHTML = "<strong>Iesniegums nav atrasts.</strong><br>Pārbaudiet numuru un e-pastu.";
        return;
      }
      if (status === 400) {
        const unknown = showFieldErrors(error.details);
        message.innerHTML = ["<strong>Pārbaudiet ievadīto.</strong>", ...unknown.map(escapeHtml)].join("<br>");
        return;
      }
      message.innerHTML = `<strong>Neizdevās pārbaudīt statusu</strong> (HTTP ${status}). Mēģiniet vēlāk.`;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearErrors();
      const payload = Object.fromEntries(new FormData(form).entries());
      // Tukšus laukus nesūtām: API pats pasaka, kas trūkst.
      for (const key of Object.keys(payload)) {
        if (payload[key] === "") delete payload[key];
      }
      submitButton.disabled = true;
      try {
        const response = await fetch("/submissions/status-lookup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        let body = null;
        try { body = await response.json(); } catch (e) { /* nav JSON */ }
        if (response.ok) {
          showResult(body);
        } else {
          showError(response.status, body);
        }
      } catch (error) {
        message.className = "message error";
        message.textContent = "Neizdevās sazināties ar serveri.";
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
